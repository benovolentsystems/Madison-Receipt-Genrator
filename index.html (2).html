<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madison Group Receipt Generator</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;color:#26344a}
.wrap{max-width:1100px;margin:24px auto;padding:16px} h1{margin:0 0 8px;font-size:24px} .sub{color:#5d6b7d;margin-bottom:18px}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:white;border-radius:12px;padding:18px;box-shadow:0 3px 15px #0001} label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input{width:100%;padding:9px;border:1px solid #ccd4df;border-radius:7px;font-size:14px;text-transform:uppercase} .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold} .print{background:#1d4ed8;color:white} .clear{background:#e5eaf1;color:#26344a}
.preview-wrap{overflow:auto;background:#e5e9ef;padding:12px;border-radius:12px}
.receipt{position:relative;width:788px;height:574px;background-size:104% 104%;background-position:center center;background-repeat:no-repeat;transform-origin:top left;}
.field{position:absolute;color:#253d81;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;max-width:42%;text-transform:uppercase;}
#vReceived{left:145px;top:202px;width:300px} #vBehalf{left:125px;top:254px;width:300px}
#vWords{left:165px;top:307px;width:610px;font-size:10px;white-space:nowrap;max-height:none;overflow:visible;max-width:none;letter-spacing:-.3px}
#vFigures{left:145px;top:359px;width:300px} #vType{left:155px;top:411px;width:280px}
#vIssued{left:120px;top:464px;width:290px} #vNo{left:575px;top:195px;width:185px}
#vDate{left:660px;top:276px;width:120px} #vMode{left:465px;top:371px;width:250px}
#vRef{left:665px;top:382px;width:120px} #vPolicy{left:455px;top:423px;width:280px}
#vAccount{left:480px;top:475px;width:275px}
.note{font-size:12px;color:#65758b;margin-top:9px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
@media print{
 html,body{width:210mm;height:297mm;margin:0!important;padding:0!important;overflow:hidden!important}
 body{background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .wrap{margin:0!important;padding:0!important;max-width:none!important;width:210mm!important;height:297mm!important}
 h1,.sub,.panel{display:none!important}
 .layout{display:block!important;width:210mm!important;height:297mm!important}
 .preview-wrap{padding:0!important;background:white!important;overflow:hidden!important;height:297mm!important;width:210mm!important;display:flex!important;align-items:center!important;justify-content:center!important}
 .receipt{transform:scale(.91)!important;width:788px!important;height:574px!important;background-size:104% 104%!important;background-position:center center!important;page-break-inside:avoid}
 @page{size:A4 portrait;margin:0}
}</style>
</head>
<body>
<div class="wrap"><h1>Madison Group Receipt Generator</h1><div class="sub">Enter receipt details below. The amount in words updates automatically. Print to paper or save as PDF.</div>
<div class="layout">
<div class="panel"><form id="receiptForm">
<label>Receipt No.</label><input id="receiptNo" placeholder="e.g. 001234">
<label>Date</label><input id="date" type="date">
<label>Received from</label><input id="received" placeholder="Name of payer">
<label>On behalf of</label><input id="behalf" placeholder="Recipient / company">
<label>Amount in figures (KES)</label><input id="amount" type="number" min="0" step="0.01" placeholder="0.00">
<label>Type of payment</label><input id="type" placeholder="e.g. Premium, deposit">
<label>Issued by</label><input id="issued" placeholder="Name">
<label>Mode of payment</label><input id="mode" placeholder="e.g. Cash, M-Pesa, bank">
<label>Policy Number</label><input id="policy" placeholder="Policy number">
<label>A/C Code / Name</label><input id="account" placeholder="Account code / name">
<label>Reference No.</label><input id="ref" placeholder="Payment reference">
<div class="btns"><button type="button" class="print" onclick="window.print()">Print / Save PDF</button><button type="button" class="clear" onclick="resetForm()">Clear</button></div>
<div class="note">For best results, enable “Background graphics” in your browser's print settings.</div>
</form></div>

<div class="field" id="vNo"></div><div class="field" id="vDate"></div><div class="field" id="vReceived"></div><div class="field" id="vBehalf"></div><div class="field" id="vWords"></div><div class="field" id="vFigures"></div><div class="field" id="vType"></div><div class="field" id="vIssued"></div><div class="field" id="vMode"></div><div class="field" id="vPolicy"></div><div class="field" id="vAccount"></div><div class="field" id="vRef"></div>
</div></div></div></div>
<script>
const fields={receiptNo:'vNo',date:'vDate',received:'vReceived',behalf:'vBehalf',amount:'vFigures',type:'vType',issued:'vIssued',mode:'vMode',policy:'vPolicy',account:'vAccount',ref:'vRef'};
function toWords(n){
 if(!isFinite(n)||n<0)return '';
 const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'], teens=['Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'], tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 function chunk(x){
  let s=''; if(x>=100){s+=ones[Math.floor(x/100)]+' Hundred ';x%=100;}
  if(x>=20){s+=tens[Math.floor(x/10)]+' ';x%=10;} else if(x>=10){s+=teens[x-10]+' ';x=0;}
  if(x>0)s+=ones[x]+' ';return s.trim();
 }
 n=Math.round(n*100)/100; let sh=Math.floor(n), cents=Math.round((n-sh)*100),parts=[];
 const scales=[['Billion',1e9],['Million',1e6],['Thousand',1e3]];
 for(const [name,val] of scales){if(sh>=val){parts.push(chunk(Math.floor(sh/val))+' '+name);sh%=val;}}
 if(sh)parts.push(chunk(sh)); let words=parts.join(' ').trim()||'Zero';
 words+=' Shillings'; if(cents)words+=' and '+chunk(cents)+' Cents'; return words+' Only';
}
function update(){
 for(const [id,out] of Object.entries(fields)){
  const el=document.getElementById(id),target=document.getElementById(out);
  let val=el.value;
  if(id==='date'&&val){const [y,m,d]=val.split('-');const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];val=d+'-'+months[Number(m)-1]+'-'+y;}
  if(id==='amount'&&val){val='KES '+Number(val).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});}
  target.textContent=String(val).toUpperCase();
 }
 const amt=document.getElementById('amount').value;
 document.getElementById('vWords').textContent=amt!==''?toWords(Number(amt)):'';
}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));
function resetForm(){document.getElementById('receiptForm').reset();update();}
function resizePreview(){
 const wrap=document.querySelector('.preview-wrap'), receipt=document.querySelector('.receipt');
 if(window.matchMedia('print').matches)return;
 let scale=Math.min(1, (wrap.clientWidth-24)/788);
 receipt.style.transform='scale('+scale+')';
 wrap.style.height=(574*scale+24)+'px';
}
window.addEventListener('resize',resizePreview);window.addEventListener('load',()=>{update();resizePreview();});
</script>
